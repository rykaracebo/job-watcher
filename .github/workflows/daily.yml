name: daily-run

on:
  schedule:
    - cron: "17 11 * * *"     # 11:17 UTC, about 6 AM Central
  workflow_dispatch:           # lets me start a run by hand

permissions:
  contents: write              # commit the data files
  issues: write                # open today's issue, close yesterday's

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch sources, rebuild history, write status
        run: python -m pipeline.run
      - name: Commit data
        run: |
          git config user.name "job-watcher[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
      # After the commit, so a problem with the issue never loses the data.
      - name: Open today's issue, close the previous one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline.issue
