<!doctype html>
<html lang="en">
<head>

<body>
  <main>

      <div id="c4"></div>
    </section>

      <h2 id="h5"></h2>
      <p id="p5"></p>
      <div id="c5"></div>

    <section class="viz-card" id="s6">
      <h2 id="h6"></h2>
      <p id="p6"></p>
      <div id="c6"></div>
    </section>

  <div class="viz-tip" id="tip" role="status" hidden></div>

  <script src="nav.js"></script>
  <script src="csv.js"></script>
  <script src="market-calc.js"></script>
  <script src="market.js"></script>
