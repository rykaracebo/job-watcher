# One entry per employer job board. All boards return JSON with no login.
#
# ats: workday | oracle | greenhouse | goldman (Goldman's own careers API)
#
# Workday fields:  host (tenant.wdN), tenant, site
# Optional filters, applied server-side by Workday so the board fits its
# 2,000-result window (paging past ~2,000 wraps back to page one):
#   search: free-text search term
#   state:  Workday "State" location facet value, e.g. Texas
# Oracle fields:   host, site, optional search (no commas)
# Greenhouse:      token (the board token)
sources:
  - {name: wells_fargo, employer: Wells Fargo,   ats: workday, host: wf.wd1,          tenant: wf,          site: WellsFargoJobs}
  - {name: citi,        employer: Citi,          ats: workday, host: citi.wd5,        tenant: citi,        site: "2", state: Texas}
  - {name: truist,      employer: Truist,        ats: workday, host: truist.wd1,      tenant: truist,      site: Careers}
  - {name: capital_one, employer: Capital One,   ats: workday, host: capitalone.wd12, tenant: capitalone,   site: Capital_One}
  - {name: td,          employer: TD,            ats: workday, host: td.wd3,          tenant: td,          site: TD_Bank_Careers}
  - {name: santander,   employer: Santander,     ats: workday, host: santander.wd3,   tenant: santander,   site: SantanderCareers}
  - {name: fidelity,    employer: Fidelity,      ats: workday, host: fmr.wd1,         tenant: fmr,         site: FidelityCareers}
  - {name: blackstone,  employer: Blackstone,    ats: workday, host: blackstone.wd1,  tenant: blackstone,  site: Blackstone_Careers}
  - {name: jll,         employer: JLL,           ats: workday, host: jll.wd1,         tenant: jll,         site: jllcareers, search: analyst}
  - {name: att,         employer: AT&T,          ats: workday, host: att.wd1,         tenant: att,         site: ATTGeneral}
  - {name: bofa,          employer: Bank of America, ats: workday,    host: ghr.wd1,          tenant: ghr,              site: lateral-us, search: analyst}
  - {name: fifth_third,   employer: Fifth Third,     ats: workday,    host: fifththird.wd5,   tenant: fifththird,       site: 53careers}
  - {name: texas_capital, employer: Texas Capital Bank, ats: workday, host: texascapitalbank.wd12, tenant: texascapitalbank, site: Careers}
  - {name: frost,         employer: Frost Bank,      ats: workday,    host: frostbank.wd5,    tenant: frostbank,        site: External}
  - {name: raymond_james, employer: Raymond James,   ats: workday,    host: raymondjames.wd1, tenant: raymondjames,     site: RaymondJamesCareers}
  - {name: jpmorgan,      employer: JPMorgan Chase,  ats: oracle,     host: jpmc.fa.oraclecloud.com, site: CX_1001, search: analyst}
  - {name: gm_financial,  employer: GM Financial,    ats: oracle,     host: fa-exvu-saasfaprod1.fa.ocs.oraclecloud.com, site: CX_1}
  - {name: kkr,           employer: KKR,             ats: greenhouse, token: stage}
  - {name: goldman,       employer: Goldman Sachs,   ats: goldman}
# Texas-only copies of four national boards. They overlap with the sources
# above (same postings, same IDs) and exist to reveal Dallas postings that
# the national list hides behind "N Locations". See README.
  - {name: wells_fargo_tx, employer: Wells Fargo, ats: workday, host: wf.wd1,        tenant: wf,        site: WellsFargoJobs, state: Texas}
  - {name: truist_tx,      employer: Truist,      ats: workday, host: truist.wd1,    tenant: truist,    site: Careers,        state: Texas}
  - {name: fidelity_tx,    employer: Fidelity,    ats: workday, host: fmr.wd1,       tenant: fmr,       site: FidelityCareers, state: Texas}
  - {name: santander_tx,   employer: Santander,   ats: workday, host: santander.wd3, tenant: santander, site: SantanderCareers, state: Texas}
